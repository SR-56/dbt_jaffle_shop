[project]
name = "dbt-jaffle-shop"
version = "0.1.0"
description = "jaffle shop: dbt-core + DuckDB + MetricFlow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11",
    "dbt-metricflow>=0.15",
    "fastmcp>=3.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
